name: Restore publication assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Restore paper and figures
        shell: bash
        run: |
          cat .assets/repo_assets.part.* | base64 --decode > /tmp/repo_assets.tar.gz
          tar -xzf /tmp/repo_assets.tar.gz
          find . -name '._*' -delete
          rm -rf .assets
          rm -f .github/workflows/assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add paper and publication figures"
          git push
