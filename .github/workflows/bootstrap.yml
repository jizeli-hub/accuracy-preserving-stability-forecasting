name: Expand repository payload

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore repository files
        shell: bash
        run: |
          cat .upload/repo_payload.part.* | base64 --decode > /tmp/repo_payload.tar.gz
          tar -xzf /tmp/repo_payload.tar.gz
          rm -rf .upload
          rm -f .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish paper and forecasting framework"
          git push
