name: Apply reproducibility provenance fix

on:
  push:
    paths:
      - .github/reproducibility_fix.b64

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply payload
        run: |
          base64 --decode .github/reproducibility_fix.b64 > /tmp/reproducibility_fix.tar.gz
          tar -xzf /tmp/reproducibility_fix.tar.gz
          rm .github/reproducibility_fix.b64
          rm .github/workflows/apply_repro_fix.yml
      - name: Verify runtime provenance
        run: python scripts/verify_runtime_table.py
      - name: Commit repaired artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add auditable runtime provenance"
          git push
